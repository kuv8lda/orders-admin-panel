<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель заказов — вход</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/vendor/fa-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin" data-title-key="title.admin">
  <main class="login-wrap">
    <div class="card login-card">
      <h2 data-i18n="login.heading">Панель заказов</h2>
      <p class="lead" data-i18n="login.lead">Войдите, чтобы управлять заказами.</p>


      <div class="inline-error hidden" id="loginError" role="alert"></div>
      <div class="ratelimit-note hidden" id="rateNote" role="status"></div>
      <form class="form" id="adminForm" aria-label="Форма входа" data-i18n-attr="aria-label:login.form" novalidate>
        <div class="field">
          <label for="username" data-i18n="login.username">Логин</label>
          <input id="username" name="username" data-i18n-attr="placeholder:login.username" placeholder="Логин" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="login.password">Пароль</label>
          <input id="password" name="password" type="password" data-i18n-attr="placeholder:login.password" placeholder="Пароль" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit">Войти</button>
      </form>

      {% if demo_mode and demo_password %}
      <div class="demo-box">
        <h3 data-i18n="login.demo_heading">Демо-доступ</h3>
        <div><b data-i18n="login.demo_user">Логин для демо:</b> <code id="demoUsername">{{ demo_username }}</code></div>
        <div><b data-i18n="login.demo_pass">Пароль для демо:</b> <code id="demoPassword">{{ demo_password }}</code></div>
        <button type="button" class="btn btn-ghost" id="fillDemo">
          <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span data-i18n="login.fill_demo">Подставить демо-данные</span>
        </button>
      </div>
      {% endif %}
    </div>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
