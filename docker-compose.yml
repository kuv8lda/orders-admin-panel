# Локальный запуск: docker compose up --build  ->  http://localhost:5000
# По умолчанию это демо (DEMO_MODE=1, логин admin / password123) на http://localhost,
# поэтому cookie без флага Secure. Для сервера задайте DEMO_MODE, ADMIN_PASSWORD
# и COOKIE_SECURE=1 в .env (см. docs/DEPLOY.md, когда он появится).
services:
  panel:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DEMO_MODE: "${DEMO_MODE:-1}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-password123}"
      SECRET_KEY: "${SECRET_KEY:-}"
      BOT_API_TOKEN: "${BOT_API_TOKEN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATABASE_PATH: "/app/instance/app.db"
    volumes:
      - panel-data:/app/instance
    restart: unless-stopped

volumes:
  panel-data:
