<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/vendor/fa-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
  <div class="dash-shell" id="dashShell">
    <aside class="sidebar" aria-label="Navigation">
      <a class="active" href="#overview" title="Overview" data-nav="overview"><i class="fa-solid fa-gauge-high"></i></a>
      <a href="#analytics" title="Analytics" data-nav="analytics"><i class="fa-solid fa-chart-line"></i></a>
      <a href="#orders" title="Orders" data-nav="orders"><i class="fa-solid fa-bag-shopping"></i></a>
      <button class="side-btn" type="button" id="sidebarLogout" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
    </aside>

    <main class="dash-main">
      <div class="topbar">
        <button class="icon-btn" id="collapseBtn" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
        <h2>Dashboard</h2>
        <div class="clock" id="clock">00:00:00</div>
        {% if demo_mode %}
        <button class="btn btn-ghost" id="resetDemoBtn" type="button" title="Reset demo data">
          <i class="fa-solid fa-rotate"></i> Reset data
        </button>
        {% endif %}
        <button class="btn btn-ghost" id="exportBtn" type="button">
          <i class="fa-solid fa-file-csv"></i> Export CSV
        </button>
        <button class="btn btn-primary" id="newOrderBtn" type="button">
          <i class="fa-solid fa-plus"></i> New order
        </button>
      </div>

      <section id="overview" class="stats" aria-label="KPI cards">
        <article class="card stat" data-kpi="revenue">
          <span class="lead">Revenue</span>
          <b><span class="skeleton" style="width:60%"></span></b>
          <div class="row"><span class="kpi-delta-flat"><i class="fa-solid fa-minus"></i> —</span></div>
        </article>
        <article class="card stat" data-kpi="orders">
          <span class="lead">Orders</span>
          <b><span class="skeleton" style="width:60%"></span></b>
          <div class="row"><span class="kpi-delta-flat"><i class="fa-solid fa-minus"></i> —</span></div>
        </article>
        <article class="card stat" data-kpi="avg">
          <span class="lead">Avg order value</span>
          <b><span class="skeleton" style="width:60%"></span></b>
          <div class="row"><span class="kpi-delta-flat"><i class="fa-solid fa-minus"></i> —</span></div>
        </article>
        <article class="card stat" data-kpi="pending">
          <span class="lead">Pending</span>
          <b><span class="skeleton" style="width:60%"></span></b>
          <div class="row"><span class="kpi-delta-flat"><i class="fa-solid fa-minus"></i> —</span></div>
        </article>
      </section>

      <section id="analytics" class="dash-grid" style="margin-bottom:14px">
        <article class="card chart-card" style="padding:16px">
          <div class="card-header">
            <h3>Revenue</h3>
            <div class="period-toggle" role="tablist" aria-label="Period">
              <button type="button" data-days="7">7d</button>
              <button type="button" data-days="30" class="active">30d</button>
              <button type="button" data-days="90">90d</button>
            </div>
          </div>
          <canvas id="revenueChart" height="120"></canvas>
        </article>
        <article class="card" style="padding:16px">
          <div class="card-header"><h3>By status</h3></div>
          <div class="donut-wrap">
            <div class="donut-canvas"><canvas id="statusChart"></canvas></div>
            <div class="legend" id="statusLegend"></div>
          </div>
        </article>
      </section>

      <section class="dash-grid" style="margin-bottom:14px">
        <article class="card" style="padding:16px">
          <div class="card-header"><h3>Top products</h3></div>
          <div class="top-products" id="topProducts">
            <div class="skeleton-row"><div class="skeleton"></div></div>
            <div class="skeleton-row"><div class="skeleton"></div></div>
            <div class="skeleton-row"><div class="skeleton"></div></div>
            <div class="skeleton-row"><div class="skeleton"></div></div>
          </div>
        </article>
        <aside class="card rightbar-card" style="padding:16px;border-left:1px solid var(--border)">
          <div class="card-header"><h3>Recent activity</h3></div>
          <div class="activity-list" id="activityList">
            <div class="skeleton-row"><div class="skeleton"></div></div>
            <div class="skeleton-row"><div class="skeleton"></div></div>
            <div class="skeleton-row"><div class="skeleton"></div></div>
          </div>
        </aside>
      </section>

      <section id="orders" aria-label="Orders table">
        <div class="filter-bar">
          <div class="chips" id="statusChips" role="group" aria-label="Status filter">
            <button class="chip active" data-status="">All <span class="count" data-count-all>-</span></button>
            <button class="chip" data-status="pending">Pending <span class="count" data-count-pending>-</span></button>
            <button class="chip" data-status="paid">Paid <span class="count" data-count-paid>-</span></button>
            <button class="chip" data-status="shipped">Shipped <span class="count" data-count-shipped>-</span></button>
            <button class="chip" data-status="completed">Completed <span class="count" data-count-completed>-</span></button>
            <button class="chip" data-status="cancelled">Cancelled <span class="count" data-count-cancelled>-</span></button>
          </div>
          <div class="filter-actions">
            <div class="search-wrap">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input id="searchInput" type="search" placeholder="Search #ID, name, email, product…" aria-label="Search orders">
            </div>
            <div class="range-grid" style="grid-template-columns:repeat(4,1fr);min-width:480px">
              <div class="field">
                <label for="dateFrom">From</label>
                <input type="date" id="dateFrom">
              </div>
              <div class="field">
                <label for="dateTo">To</label>
                <input type="date" id="dateTo">
              </div>
              <div class="field">
                <label for="minAmount">Min ₽</label>
                <input type="number" id="minAmount" step="0.01" min="0" placeholder="0.00">
              </div>
              <div class="field">
                <label for="maxAmount">Max ₽</label>
                <input type="number" id="maxAmount" step="0.01" min="0" placeholder="100000">
              </div>
            </div>
            <button type="button" class="btn btn-ghost" id="resetFiltersBtn"><i class="fa-solid fa-xmark"></i> Reset</button>
          </div>
        </div>

        <article class="card" style="padding:16px">
          <div class="table-wrap" id="tableWrap">
            <table id="ordersTable" aria-label="Orders">
              <thead>
                <tr>
                  <th data-sort="id">#<span class="sort-indicator"></span></th>
                  <th data-sort="customer_name">Customer<span class="sort-indicator"></span></th>
                  <th data-sort="product">Product<span class="sort-indicator"></span></th>
                  <th data-sort="amount_cents">Amount<span class="sort-indicator"></span></th>
                  <th data-sort="status">Status<span class="sort-indicator"></span></th>
                  <th data-sort="created_at" class="active-sort">Date<span class="sort-indicator">▼</span></th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody id="ordersBody">
                <tr><td colspan="7"><div class="skeleton" style="height:200px;border-radius:12px"></div></td></tr>
              </tbody>
            </table>
            <div id="tableState" class="hidden"></div>
          </div>
          <div class="pagination" id="pagination" aria-label="Pagination"></div>
        </article>
      </section>
    </main>

    <aside class="rightbar" aria-label="Right panel" style="display:none"></aside>
  </div>

  <datalist id="productsDatalist">
    <option value="Landing kit"></option>
    <option value="Telegram bot"></option>
    <option value="Dashboard"></option>
    <option value="Scraper"></option>
    <option value="Admin panel"></option>
    <option value="Web app"></option>
    <option value="Storefront"></option>
    <option value="Analytics"></option>
    <option value="Bot upgrade"></option>
  </datalist>

  <div class="modal-backdrop" id="newOrderModal" aria-hidden="true">
    <div class="modal">
      <h3>New order</h3>
      <form class="form" id="newOrderForm" novalidate>
        <div class="field">
          <label for="noName">Customer name *</label>
          <input id="noName" name="customer_name" placeholder="e.g. Jane Doe" required>
          <div class="field-error" data-error-for="customer_name"></div>
        </div>
        <div class="field">
          <label for="noEmail">Email (optional)</label>
          <input type="email" id="noEmail" name="customer_email" placeholder="jane@example.com">
          <div class="field-error" data-error-for="customer_email"></div>
        </div>
        <div class="field">
          <label for="noProduct">Product *</label>
          <input id="noProduct" name="product" list="productsDatalist" placeholder="e.g. Dashboard" required>
          <div class="field-error" data-error-for="product"></div>
        </div>
        <div class="field">
          <label for="noAmount">Amount (RUB) *</label>
          <input id="noAmount" name="amount" type="number" step="0.01" min="0" placeholder="2400.00" required>
          <div class="field-error" data-error-for="amount"></div>
        </div>
        <div class="field">
          <label for="noNote">Note (optional, max 500 chars)</label>
          <textarea id="noNote" name="note" rows="2" maxlength="500" placeholder="Internal note"></textarea>
          <div class="field-error" data-error-for="note"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="newOrderModal">Cancel</button>
          <button class="btn btn-primary" type="submit">Create order</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="confirmModal" aria-hidden="true">
    <div class="modal">
      <h3 id="confirmTitle">Confirm</h3>
      <p class="lead" id="confirmBody">Are you sure?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="confirmModal">Cancel</button>
        <button class="btn btn-primary" id="confirmOk" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div class="drawer" id="orderDrawer" role="dialog" aria-modal="true" aria-label="Order details">
    <div class="drawer-header">
      <h3 id="drawerTitle">Order #1001</h3>
      <div class="spacer"></div>
      <button class="icon-btn" type="button" id="drawerClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="drawerBody">
      <div class="skeleton" style="height:200px"></div>
    </div>
  </div>
  <div class="modal-backdrop" id="drawerBackdrop" style="z-index:54;display:none"></div>

  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
